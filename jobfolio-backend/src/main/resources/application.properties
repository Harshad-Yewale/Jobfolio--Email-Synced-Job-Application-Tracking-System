spring.application.name=jobfolio

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/jobfolio_db
spring.datasource.username=postgres
spring.datasource.password=root

#google client
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}


#Encryption
encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway will manage the schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jobsearch.service.url=http://localhost:8000
